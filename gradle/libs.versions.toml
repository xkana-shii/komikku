coil-gif = { module = "io.coil-kt.coil3:coil-gif" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp" }

# KMK -->
# Mihon's SSIV fork (its `Decoder` uses ca.mpreg:imagedecoder). The tachiyomiorg fork
# (`66e0db195d`) still links against the legacy `tachiyomi.decoder.ImageDecoder`, which this fork no
# longer ships (it uses ca.mpreg:imagedecoder), so its SSIV reader path crashed at runtime. This hash
# is the one mihon/main pairs with image-decoder 16.
subsamplingscaleimageview = "com.github.mihonapp:subsampling-scale-image-view:1b283e2bc4"
# KMK <--
image-decoder = { module = "ca.mpreg:imagedecoder", version.ref = "image-decoder" }
webgpuviewer = { module = "ca.mpreg:webgpuviewer", version.ref = "webgpuviewer" }

natural-comparator = "com.github.gpanther:java-nat-sort:natural-comparator-1.1"

richeditor-compose = "com.mohamedrejeb.richeditor:richeditor-compose:1.0.0-rc13"

material = "com.google.android.material:material:1.14.0"
flexibleAdapter = { module = "eu.davidea:flexible-adapter", version.ref = "flexibleAdapter" }
photoview = "com.github.chrisbanes:PhotoView:2.3.0"
directionalviewpager = "com.github.tachiyomiorg:DirectionalViewPager:1.0.0"
compose-materialmotion = "io.github.fornewid:material-motion-compose-core:2.0.1"
